onboarding:
  seen:
    busy_input_prompt: true
auxiliary:
  compression:
    provider: main
    model: gpt-6-sol
    timeout: 120
  session_search:
    provider: main
    model: gpt-6-sol
    timeout: 60
    max_concurrency: 2
  title_generation:
    provider: main
    model: gpt-6-sol
    timeout: 30
  vision:
    provider: main
    model: gpt-6-sol
