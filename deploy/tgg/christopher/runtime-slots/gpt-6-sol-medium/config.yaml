model:
  provider: openai-direct-primary
  default: gpt-6-sol
  base_url: https://api.openai.com/v1
  api_key_source:
    type: env
    secrets_env_key: OPENAI_API_KEY
agent:
  profile: pa
  max_turns: 90
  reasoning_effort: medium
pa:
  enabled: false
  media_retention:
    enabled: true
    media_root: /home/pclaw/.systems-pcl/data/media/tgg/hermes
    media_ref_prefix: /media/tgg/hermes
    source_roots:
    - /var/lib/tgg-capture/whatsapp/media
    operation: tgg_media_retention
    min_free_bytes: 5368709120
    max_attempts: 5
    retry_interval_seconds: 60
  report_operations:
    enabled: true
    base_url: https://systems.papercut-labs.com
    allowed_download_hosts:
    - systems.papercut-labs.com
    allow_insecure_downloads: false
    timeout_seconds: 120
    download_root: /home/pclaw/.systems-pcl/data/media/tgg/hermes/report-runs
    headers:
      X-PS-Tenant: tgg
      User-Agent: christopher-hermes/report-operations
    schedule:
      enabled: false
    auth:
      token_env: CHRISTOPHER_TGG_PS_SERVICE_TOKEN
      header: Authorization
      scheme: Bearer
    operations:
      fetch-sources: {method: POST, path: '/api/operator/report-cycle/fetch-sources?tenant=tgg'}
      preview-reconcile: {method: POST, path: '/api/operator/report-cycle/preview-reconcile?tenant=tgg'}
      apply-reconcile: {method: POST, path: '/api/operator/report-cycle/apply-reconcile?tenant=tgg'}
      generate: {method: POST, path: '/api/operator/report-cycle/generate?tenant=tgg'}
      get-reports: {method: POST, path: '/api/operator/report-cycle/get-reports?tenant=tgg'}
      status: {method: POST, path: '/api/operator/report-cycle/status?tenant=tgg'}
  constitution_path: /home/pclaw/.hermes-christopher-tgg/christopher_tgg_constitution.yaml
  overlay:
    identity:
      display_name: Christopher
      voice_register: terse operations concierge
      greeting_style: short, direct, work-first
      signature: ''
      refer_to_self: Christopher
    client:
      id: tgg
      name: TGG
      tenant: tgg
      business_bridge:
        tenant: tgg
        auth:
          type: bearer
          token_env: CHRISTOPHER_TGG_PS_SERVICE_TOKEN
        operations:
          tgg_case_create:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/cases/create
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_case_lookup:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/cases/{jobNo}
            path_params:
            - jobNo
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_case_list:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/cases
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_case_search:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/cases
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_case_update:
            type: http
            tenant: tgg
            method: PATCH
            url: https://systems.papercut-labs.com/api/operator/cases/{jobNo}/state
            path_params:
            - jobNo
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_case_observation:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/cases/{jobNo}/observations
            path_params:
            - jobNo
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          work_costing_lookup:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/work-costings/{wcNo}
            path_params:
            - wcNo
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          job_work_costings:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/cases/{jobNo}/work-costings
            path_params:
            - jobNo
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          work_costing_upsert:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/work-costings
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          work_costing_ingest_ilinked:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/work-costings/ingest-ilinked/{jobNo}
            path_params:
            - jobNo
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 20
          tgg_clarification_raise:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/clarifications
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_attention_raise:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/attention-items
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_attention_list:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/attention-items
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_attention_read:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/attention-items/{id}
            path_params:
            - id
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_attention_annotate:
            type: http
            tenant: tgg
            method: PATCH
            url: https://systems.papercut-labs.com/api/operator/attention-items/{id}
            path_params:
            - id
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_case_wc_attach:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/cases/{jobNo}/work-costings
            path_params:
            - jobNo
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_human_resolution_create:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/human-resolution-records
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_human_resolution_document_append:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/human-resolution-documents
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_human_resolution_document_context:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/human-resolution-documents/{id}
            path_params:
            - id
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_human_resolution_apply_case_update:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/human-resolution-documents/{id}/resolved-case-update
            path_params:
            - id
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_case_query:
            type: http
            tenant: tgg
            method: POST
            # Temporary reconciliation exam target. Roll back the immutable
            # Christopher deployment after the live WhatsApp exam.
            url: http://127.0.0.1:5197/api/operator/query
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_case_media:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/cases/{jobNo}/media
            path_params:
            - jobNo
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          tgg_media_retention:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/messages/media-retention
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 20
          agent_config_read:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/agent-config
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          agent_action_record:
            type: http
            tenant: tgg
            method: POST
            url: https://systems.papercut-labs.com/api/operator/agent-actions
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
          ilinked_lookup:
            type: command
            tenant: tgg
            command:
            - python3
            - -m
            - tools.tgg_ilinked_lookup
            timeout: 90
          ilinked_wc_lookup:
            type: command
            tenant: tgg
            command:
            - python3
            - -m
            - tools.tgg_ilinked_reads
            - wc
            timeout: 30
          ilinked_status:
            type: command
            tenant: tgg
            command:
            - python3
            - -m
            - tools.tgg_ilinked_reads
            - status
            timeout: 30
          message_search:
            type: http
            tenant: tgg
            method: GET
            url: https://systems.papercut-labs.com/api/operator/messages/search
            headers:
              X-PS-Tenant: tgg
              User-Agent: curl/8.7.1
            timeout: 10
      agent_id: christopher
      owner: Christopher
