providers:
  openai-direct-primary:
    name: OpenAI Direct Primary
    api: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    default_model: gpt-6-sol
    transport: codex_responses

# one conversation per group chat (teren-greenlit 2026-06-17) — overrides per-participant default
group_sessions_per_user: false
timezone: Asia/Singapore
session_reset:
  mode: none
memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2200
python_sandbox:
  enabled: true
  workspace: session
  artifact_url_base: https://systems.papercut-labs.com/api/view/sandbox-artifacts
  media_retention:
    root: /home/pclaw/.systems-pcl/data/media/tgg/hermes
    media_ref_prefix: /media/tgg/hermes
  datasets:
    cases:
      type: sqlite
      path: /home/pclaw/.systems-pcl/data/tenants/tgg.db
      description: "Operational case/work-costing database (read-only snapshot; sqlite)"
    media:
      type: path
      path: /home/pclaw/.systems-pcl/data/media/tgg/hermes
      description: "Retained WhatsApp media/attachments (read-only; spreadsheets land here)"
    documents:
      type: path
      path: /var/lib/tgg-capture/whatsapp/media/documents
      description: "Documents uploaded in WhatsApp chats, ORIGINAL filenames matching the saved-at path shown in the message (read-only)"
  limits:
    wall_seconds: 360
    max_wall_seconds: 600
    cpu_seconds: 300
    memory_mb: 1024
    file_size_mb: 64
    scratch_mb: 256
    max_processes: 64
    max_open_files: 256
    max_snapshot_mb: 512
  artifact_ttl_days: 7
  max_runs_kept: 40
  max_session_workspaces: 40
plugins:
  enabled:
  - report-operations
