apiVersion: pa.papercutlabs.com/v1
kind: ClientAgentDeployment

metadata:
  name: christopher-tgg
  client: tgg
  agent: christopher
  owner: edna
  environment: production
  sourceWb: 27b80282-e7ac-4b1a-bbf4-5a8c6f897552

spec:
  # The deployment points at an immutable AgentBrain recovery. It does not copy
  # the behavior payload into this file. The two source artifacts and their
  # composite hash make the pointer independently reconstructable.
  brainRef: agentbrain:tgg:christopher:june-2026@sha256:433d98de07a61f6978862db04fa1a81a943a81bad92446898c26741652afea1e
  brain:
    sourceSnapshotCommit: bd57c948a7b3d2bf80242ef4e373b987ca9d21d3
    recoveryCommit: 2aad945aba62c78a3f617ce18470b66848529435
    recoveredConfig:
      path: deploy/tgg/christopher/baselines/june-2026/config.live-2026-06-19.yaml
      sha256: 27c005b2edf83ff978940841bdabe8f9acc4790e600cb957022d2471650a17b5
    recoveredConstitution:
      path: deploy/tgg/christopher/baselines/june-2026/christopher_tgg_constitution.live-2026-06-19.yaml
      sha256: 59dfdf8c8d66b12e6b473b3c89965908932b8e5e6b2f2f31bfa9790e7d2e9bff
    provenance:
      path: deploy/tgg/christopher/baselines/june-2026/PROVENANCE.md
      checksumManifest: deploy/tgg/christopher/baselines/june-2026/SHA256SUMS

  host:
    hostRef: tenant:tgg/host:app-1
    resolution:
      command: pcl service locate --system christopher --domain pa
      expectedSshTargetAlias: tgg-app-1
      expectedHostname: tgg-app-1
    forbiddenTargets:
      - rescue-box

  roles:
    runtime:
      hostRef: tenant:tgg/host:app-1
      owner: edna
      mutablePaths:
        - /home/pclaw/apps/hermes-pcl
        - /home/pclaw/.hermes-christopher-tgg
        - /home/pclaw/.hermes-christopher-tgg-test
        - /etc/systemd/system/christopher-tgg-hermes.service
        - /etc/systemd/system/christopher-tgg-hermes-health.service
        - /etc/systemd/system/christopher-tgg-hermes-health.timer
        - /etc/systemd/system/christopher-tgg-report-weekly.service
        - /etc/systemd/system/christopher-tgg-report-weekly.timer
        - /etc/systemd/system/christopher-tgg-report-monthly.service
        - /etc/systemd/system/christopher-tgg-report-monthly.timer
        - /etc/systemd/system/christopher-tgg-nightly-whatsapp.service
        - /etc/systemd/system/christopher-tgg-nightly-whatsapp.timer
        - /etc/systemd/system/christopher-tgg-retention-cleanup.service
        - /etc/systemd/system/christopher-tgg-retention-cleanup.timer
    capture:
      hostRef: tenant:tgg/host:app-1
      owner: stream-f
      access: read-only
      service: tgg-capture-whatsapp-bridge.service
      forbiddenActions:
        - restart
        - stop
        - reconfigure
        - write /opt/tgg-capture
        - write /var/lib/tgg-capture
    systems:
      owner: stream-a
      access: none
      forbiddenActions:
        - write application paths
        - restart application units

  runtime:
    implementation: hermes-pcl
    sourceRepository:
      canonicalCheckout: /Users/pcloffice/pcl-dev/hermes-pcl
      upstreamUpgradeAllowed: false
      note: The intentional upstream lag is outside this deployment.
    remoteAppRoot: /home/pclaw/apps/hermes-pcl
    user: pclaw
    group: pclaw
    supplementaryGroups:
      - tggcapture
    hermesHome: /home/pclaw/.hermes-christopher-tgg
    testHome: /home/pclaw/.hermes-christopher-tgg-test
    configPath: /home/pclaw/.hermes-christopher-tgg/config.yaml
    constitutionPath: /home/pclaw/.hermes-christopher-tgg/christopher_tgg_constitution.yaml
    stateDbPath: /home/pclaw/.hermes-christopher-tgg/state.db
    groupSessionsPerUser: false

  processing:
    enabled: false
    authority: teren-rung-gate
    activationIncludedInThisDeployment: false
    activationPrimitive: deploy/tgg/christopher/scripts/activate_processing.py
    activationSemantics: >-
      The primitive ships with the runtime but deploy never invokes it. A separate
      Teren-authorized trust-ladder transition must prove the canonical check
      handoff, stage the bridge fail-closed, then invoke both-key activation.
    gatePath: /home/pclaw/.hermes-christopher-tgg/runtime/processing-gate.json
    configPath: /home/pclaw/.hermes-christopher-tgg/config.yaml
    configKey: pa.enabled
    requiredConfigValue: false
    effectiveEnableRule: pa.enabled AND processing-gate.enabled
    initialCursorPosition: end
    cursorPath: /home/pclaw/.hermes-christopher-tgg/runtime/capture-cursor.json
    inboxPath: /home/pclaw/.hermes-christopher-tgg/runtime/capture-inbox.db
    standbyContract:
      configEnabled: false
      gateEnabled: false
      sourceOpened: false
      cursorAdvanced: false
      productionInboxRows: 0
      productionTurnsAfterDisabledBoundary: 0
      outboundSent: 0

  engine:
    provider: openai-direct-primary
    transport: codex_responses
    baseUrl: https://api.openai.com/v1
    defaultSlot: gpt-5.4-mini
    allowedSlots:
      - gpt-5.4-mini
      - gpt-5.6-luna
      - gpt-5.6-luna-low
      - gpt-5.6-luna-xhigh
      - gpt-5.6-terra-medium
      - gpt-5.6-terra-high
      - gpt-6-sol-medium
      - gpt-6.1-sol-medium
    slotManifest: deploy/tgg/christopher/runtime-slots/SHA256SUMS
    slotStatePath: /home/pclaw/.hermes-christopher-tgg/runtime/engine-slot
    switchCommand: /opt/tgg-christopher/runtime/current/deploy/tgg/christopher/scripts/switch_engine_slot.sh
    switchRequiresCodeRedeploy: false
    auxiliary:
      provider: openai-direct-primary
      model: per-slot-primary

  env:
    materialization: /home/pclaw/.hermes-christopher-tgg/.env
    mode: "0600"
    refs:
      - name: OPENAI_API_KEY
        source: marshal-secrets
        requiredWhen: always
      - name: CHRISTOPHER_TGG_PS_SERVICE_TOKEN
        source: /etc/systems-papercut-labs/tgg.env#CHRISTOPHER_TGG_PS_SERVICE_TOKEN
        materializer: deploy/tgg/christopher/scripts/processing_activation_transaction.py
        verifier: >-
          GET /api/operator/auth/identity must return tenant=tgg, agent=christopher,
          and all operator scopes; then GET /api/operator/cases/count must pass
        requiredWhen: processing-enabled
    secretValuesInSpec: false

  channels:
    whatsapp:
      declared: true
      hermesBuiltInGatewayEnabled: false
      externalCaptureService: tgg-capture-whatsapp-bridge.service
      captureBind: 127.0.0.1:3011
      durableSource:
        path: /var/lib/tgg-capture/whatsapp/capture/events.jsonl
        access: read-only
        ordering: append-before-volatile-queue
        mediaRoot: /var/lib/tgg-capture/whatsapp/media
      mediaRetention:
        enabled: true
        sourceGate: pa.enabled-and-processing-gate
        sourceRoots:
          - /var/lib/tgg-capture/whatsapp/media
        mediaRoot: /home/pclaw/.systems-pcl/data/media
        convergenceOperation: tgg_media_retention
        retrievalOperation: tgg_case_media
        retrievalTool: tgg_case_photos
        ordering: retain-and-converge-while-business-pending-before-lane-selection-with-claimed-chat-idempotent-safety-net
        failureDisposition: retry-up-to-max-attempts-then-quarantine-full-envelope-and-failure-history-and-bypass-for-business-processing
        maxAttempts: 5
        retryIntervalSeconds: 60
        activationBacklogPreflight: all-image-paths-from-current-cursor-must-resolve
        minimumRealVolumeFreeBytes: 5368709120
        pathContract: opaque-media-refs-resolved-under-configured-root
        delivery:
          route: /send-media
          destination: current-triggering-management-chat-only
          durableKey: chat-id-plus-current-inbound-anchor-plus-media-identity-plus-ordinal
          unknownOutcome: durable-undelivered-no-blind-retry
          staleOrNonManagement: suppress
        rollback: disable-retention-and-media-send-preserve-retained-data-and-cursors
      consumer:
        implementation: gateway/durable_jsonl_consumer.py
        mode: durable-jsonl-tail
        caseDbPath: /home/pclaw/.systems-pcl/data/tenants/tgg.db
        sourceEvidenceBeforeImageDir: /home/pclaw/.hermes-christopher-tgg/runtime/source-evidence-before-images
        sourceProjectionOrdering: exact-claimed-rows-before-hermes-model-and-business-writes
        sourceProjectionFailure: business-row-pending-retry-without-daemon-death
        scheduler: per-chat-parallel
        siteConcurrency: 4
        chatBatchSize: 25
        retentionBatchSize: 25
        managementCapacity: reserved
        singletonLock: /home/pclaw/.hermes-christopher-tgg/runtime/capture-consumer.lock
        cursorCommitRule: sqlite-inbox-before-cursor
        outboundDelivery: disabled
        liveTestInputAllowed: false
        fixtureTestOnly: true
        statusMediaFields:
          - retention_total
          - retention_failures
          - retention_attempts
          - retention_pending
          - retention_complete
          - retention_bypassed
          - retention_held
          - retention_quarantined
          - retention_quarantine_status
          - retention_quarantine_message_ids
          - retention_hold
          - media_root_count
          - media_root_bytes
          - media_volume_free_percent
          - media_volume_free_bytes
          - media_volume_total_bytes
      prohibitedConsumerSurface:
        method: GET
        path: /messages
        reasons:
          - destructive splice drains the whole in-memory queue
          - at-most-once with no cursor, acknowledgement, lease, retry, or replay
          - concurrent consumers race and crash-after-GET loses buffer items to the consumer
          - unauthenticated to any loopback process
          - queue is capped at 100 and drops the oldest item on overflow
      capturedItemFields:
        - messageId
        - chatId
        - senderId
        - senderName
        - chatName
        - isGroup
        - body
        - hasMedia
        - mediaType
        - mediaUrls
        - mentionedIds
        - quotedMessageId
        - quotedParticipant
        - quotedRemoteJid
        - hasQuotedMessage
        - botIds
        - timestamp
        - fromMe
        - historySync
        - historySyncType
        - historyIsLatest
      timestampContract: producer-native; consumers must not assume ISO-8601
      allowlists:
        directMessages:
          - "6591455515"
          - "188690831777827"
          - "6596515711"
          - "6594564662"
          - "6591711776"
          - "6591132954"
          - "6580913349"
          - "244809512038554"
        operationsChats:
          - 120363403088884777@g.us
          - 120363403845802098@g.us
          - 120363405141229117@g.us
          - 120363420803272720@g.us
          - 120363421153247095@g.us
          - 120363421424519051@g.us
          - 120363422582425366@g.us
          - 120363423535922556@g.us
          - 120363423568509280@g.us
          # Authored addition (2026-07-21 demo end-state): ops-test ingest
          # group, inserted by the build layer after the last recovered ops
          # selector. Mirrored in validate_deployment_spec.AUTHORED_SELECTOR_ADDITIONS.
          - 120363429226022766@g.us
        managementChats:
          - 120363409954029949@g.us
          - 120363427363740087@g.us
          - 120363427897872447@g.us
          - 120363407433776639@g.us
          - 120363426509183563@g.us
          - 120363407903158826@g.us
        outboundAllowedChats:
          - 120363409954029949@g.us
          - 120363427363740087@g.us
          - 120363427897872447@g.us
          - 120363407433776639@g.us
          - 120363426509183563@g.us
          - 120363407903158826@g.us
      currentOutboundPolicy: no-external-send
    telegram:
      declaredByBrainSelectors: true
      ingressDeployed: false
      processingEnabled: false
      selectorChats:
        operations:
          - "-5192935862"
        management:
          - "-5295904349"

  units:
    owned:
      - name: christopher-tgg-hermes.service
        desiredState: active-enabled
        source: deploy/tgg/christopher/systemd/christopher-tgg-hermes.service
      - name: christopher-tgg-hermes-health.service
        desiredState: oneshot-on-timer
        source: deploy/tgg/christopher/systemd/christopher-tgg-hermes-health.service
      - name: christopher-tgg-hermes-health.timer
        desiredState: active-enabled
        source: deploy/tgg/christopher/systemd/christopher-tgg-hermes-health.timer
      - name: christopher-tgg-report-weekly.service
        desiredState: disabled-oneshot
        source: deploy/tgg/christopher/systemd/christopher-tgg-report-weekly.service
      - name: christopher-tgg-report-weekly.timer
        desiredState: disabled
        source: deploy/tgg/christopher/systemd/christopher-tgg-report-weekly.timer
      - name: christopher-tgg-report-monthly.service
        desiredState: disabled-oneshot
        source: deploy/tgg/christopher/systemd/christopher-tgg-report-monthly.service
      - name: christopher-tgg-report-monthly.timer
        desiredState: disabled
        source: deploy/tgg/christopher/systemd/christopher-tgg-report-monthly.timer
      - name: christopher-tgg-nightly-whatsapp.service
        desiredState: oneshot-on-timer
        source: deploy/tgg/christopher/systemd/christopher-tgg-nightly-whatsapp.service
      - name: christopher-tgg-nightly-whatsapp.timer
        desiredState: active-enabled
        source: deploy/tgg/christopher/systemd/christopher-tgg-nightly-whatsapp.timer
      - name: christopher-tgg-retention-cleanup.service
        desiredState: oneshot-on-timer
        source: deploy/tgg/christopher/systemd/christopher-tgg-retention-cleanup.service
      - name: christopher-tgg-retention-cleanup.timer
        desiredState: active-enabled
        source: deploy/tgg/christopher/systemd/christopher-tgg-retention-cleanup.timer
    externalDependencies:
      - name: tgg-capture-whatsapp-bridge.service
        owner: stream-f
        requiredState: active
        interaction: read-only filesystem dependency only
        restartAllowed: false

  deploy:
    # Christopher no longer has a Marshal/pa-agent deploy entry point. The
    # fixed host-owned standalone executor is the only activation authority.
    controller: tgg-christopher-standalone-release
    manifestRef: deploy/tgg/christopher/pa-agent.hermes.manifest.json
    runtimeFileSetBuilder: deploy/tgg/christopher/scripts/build_pa_agent_manifest.py
    transport: standalone-bundle
    immutableBundles: true
    remoteBoxEditingAllowed: false
    canonicalDeployCommand: /usr/local/lib/tgg-christopher/standalone_release.py apply
    legacyMarshalDeployment:
      status: retired
      formerDeployCommand: deploy/tgg/christopher/scripts/deploy_runtime.sh
      refusal: >-
        The legacy command exits before any subprocess, systemctl, SSH, or
        network action and points to the fixed standalone executor.
    verifyCommand: /usr/local/lib/tgg-christopher/standalone_release.py apply
    rollback:
      controllerCommand: /usr/local/lib/tgg-christopher/standalone_release.py rollback
      retainedDeploys: 5
      scope: hermes-only
      firstDeployFallback:
        - stop and disable Christopher Hermes-owned units
        - remove only Christopher Hermes unit links
        - preserve capture and systems services and data

  acceptance:
    - deployed file hashes match the selected committed slot manifest
    - pa.enabled is false, group_sessions_per_user is false, timezone is Asia/Singapore, and session_reset mode is none
    - the production consumer remains standby without opening capture state
    - production cursor equals its immutable initial end-of-file boundary
    - production inbox and post-boundary production turn count are zero
    - owned Hermes service and health timer are active
    - the destructive /messages route is absent from the consumer unit
    - retained media is contained under the configured Systems media root and converges before model execution
    - low real-volume free space or unresolvable mandatory media fails health and holds processing
    - management permits tgg_case_media while ops ingest denies case media and retention operations
    - the configured OpenAI slot and OpenAI auxiliary model are reachable
    - a fixture-only controlled inbound produces a completed pa_turn on the deployed stack
    - the isolated turn records exact provider and model with a non-empty response
    - isolated verification records zero client mutations and zero external sends
    - a second agent independently confirms source, live state, and rebuildability

  reconciliation:
    stateChangeCheck:
      logicalKey: pa.tgg.christopher.runtime_invariants
      definition: deploy/tgg/christopher/checks/runtime-invariants.json
      command: deploy/tgg/christopher/scripts/verify_runtime.sh --check-mode
      owner: edna
      expectedCadence: on-deploy and state-change, hourly full reconciliation, every 15 minutes on-host quick verification
      redAction: page-edna-and-fail-closed
